<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>墓場の騎士</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:sans-serif}
#wrap{display:flex;flex-direction:column;height:100%}
#screen{position:relative;width:100%;flex:none}
canvas{display:block;width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#mute{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;border:1px solid #777;font-size:18px;display:flex;align-items:center;justify-content:center}
#pad{flex:1;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;box-sizing:border-box;min-height:150px;background:#141018}
.grp{display:flex;gap:min(12px,2.5vw);align-items:center}
.btn{width:min(70px,18vw);height:min(70px,18vw);border-radius:50%;background:#2c2733;border:3px solid #5a5266;color:#eee;font-size:24px;display:flex;align-items:center;justify-content:center;font-weight:bold;touch-action:none}
.btn small{font-size:15px}
.dpad{display:grid;grid-template-columns:auto auto;gap:6px min(14px,3vw)}
.dpad .down{grid-column:1/3;justify-self:center}
.btn.on{filter:brightness(1.7)}
.btn.a{background:#7a1f1f;border-color:#c44}
.btn.b{background:#1f3a7a;border-color:#48c}
@media (orientation:landscape){
 #screen{height:100%;display:flex;justify-content:center}
 canvas{width:auto;height:100%}
 #pad{position:absolute;left:0;right:0;bottom:0;background:none;pointer-events:none;min-height:0}
 .btn{pointer-events:auto;opacity:.55}
 #mute{top:6px;bottom:auto}
}
</style>
</head>
<body>
<div id="wrap">
 <div id="screen"><canvas id="c"></canvas><div id="mute">♪</div></div>
 <div id="pad">
  <div class="grp dpad"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div><div class="btn down" data-k="down">▼</div></div>
  <div class="grp"><div class="btn b" data-k="fire"><small>攻撃</small></div><div class="btn a" data-k="jump"><small>ジャンプ</small></div></div>
 </div>
</div>
<script>
const W=256,H=176;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;

/* ===== 入力 ===== */
const keys={left:false,right:false,down:false,jump:false,fire:false};
let jumpPressed=false,firePressed=false,tapped=false;
function setKey(k,v){if(v&&!keys[k]){if(k==='jump')jumpPressed=true;if(k==='fire')firePressed=true;}keys[k]=v;}
document.querySelectorAll('.btn[data-k]').forEach(b=>{
 const k=b.dataset.k;
 const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}setKey(k,true);b.classList.add('on');startAudio();};
 const off=e=>{e.preventDefault();setKey(k,false);b.classList.remove('on');};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
 b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();startAudio();tapped=true;});
const KM={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',KeyS:'down',KeyZ:'jump',Space:'jump',ArrowUp:'jump',KeyX:'fire'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){e.preventDefault();startAudio();setKey(k,true);}if(e.code==='Enter'){startAudio();tapped=true;}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)setKey(k,false);});
document.getElementById('mute').addEventListener('pointerdown',e=>{
 e.preventDefault();e.stopPropagation();startAudio();muted=!muted;
 e.currentTarget.textContent=muted?'×':'♪';if(!muted&&AC)bgmNext=AC.currentTime+0.05;
});

/* ===== サウンド ===== */
let AC=null,master=null,muted=false,nbuf=null;
function startAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.25;master.connect(AC.destination);bgmNext=AC.currentTime+0.05;}catch(_){}
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,d,type='square',v=0.3,slide=0,when=0){
 if(!AC||muted)return;const t=AC.currentTime+Math.max(0,when);
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);
}
function noise(d,v=0.3,when=0){
 if(!AC||muted)return;
 if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 const s=AC.createBufferSource();s.buffer=nbuf;const g=AC.createGain();const t=AC.currentTime+Math.max(0,when);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(g);g.connect(master);s.start(t);s.stop(t+d);
}
function sfx(n){
 switch(n){
  case'jump':tone(260,0.12,'square',0.18,300);break;
  case'throw':tone(700,0.07,'square',0.14,-400);break;
  case'tink':tone(1500,0.05,'square',0.12);break;
  case'hit':tone(300,0.06,'square',0.2,-150);break;
  case'kill':noise(0.15,0.3);tone(220,0.15,'sawtooth',0.18,-150);break;
  case'armor':noise(0.3,0.4);tone(500,0.35,'square',0.2,-420);break;
  case'die':tone(420,0.9,'square',0.22,-360);break;
  case'pickup':tone(880,0.08,'square',0.15);tone(1320,0.14,'square',0.15,0,0.08);break;
  case'crow':tone(900,0.15,'sawtooth',0.1,-500);break;
  case'dive':tone(600,0.25,'sawtooth',0.1,-350);break;
  case'fire':tone(150,0.3,'sawtooth',0.2,-80);break;
  case'land':noise(0.3,0.5);break;
  case'pot':noise(0.12,0.3);tone(400,0.08,'triangle',0.2);break;
  case'gfire':tone(420,0.18,'triangle',0.12,500);break;
  case'goff':tone(900,0.45,'sine',0.16,-700);break;
  case'gback':[0,0.08,0.16].forEach((w,i)=>tone([660,880,1320][i],0.14,'sine',0.13,0,w));break;
  case'gget':[0,0.1,0.2,0.3].forEach((w,i)=>tone([523,659,784,1046][i],0.2,'sine',0.14,0,w));break;
 }
}
/* うなる音色：2本の発振器を少しずらして重ね、ローパスでこもらせる */
function voice(f,d,{type='sawtooth',v=0.1,when=0,det=0,cut=0,att=0.005}={}){
 if(!AC||muted)return;const t=AC.currentTime+Math.max(0,when);
 const g=AC.createGain();
 if(cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;fl.Q.value=4;g.connect(fl);fl.connect(master);}else g.connect(master);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(0.001,t+d);
 for(const dc of(det?[-det,det]:[0])){const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=dc;o.connect(g);o.start(t);o.stop(t+d+0.05);}
}
/* 弔いの鐘（金属的な倍音を重ねる） */
function bell(f,when=0){[[1,0.12,3],[2.76,0.06,1.6],[5.4,0.035,0.8],[0.5,0.08,3.5]].forEach(([m,v,d])=>voice(f*m,d,{type:'sine',v,when}));}
/* ベース：ギャロップ（ダッ・ダダ・ダッ）で地を這うリズム */
function gallop(roots,len,hits){const a=[];for(let i=0;i<len;i++){const r=roots[Math.floor(i/8)%roots.length];a.push(hits.includes(i%8)?r:0);}return a;}
const SONGS={
 // 道中：Dフリジア＋三全音（悪魔の音程）。重い鼓動と低い唸り、ループ頭で鐘が鳴る
 stage:{bpm:104,lead:'square',cut:1600,melLen:1.8,
  mel:[62,0,0,63, 62,0,0,0, 68,0,67,0, 63,0,62,0, 62,0,0,63, 62,0,65,0, 68,0,0,0, 67,66,63,62],
  bass:gallop([38,38,44,39],32,[0,2,3,4,6]),
  drone:[38,44],
  drum:'K.......k...s...k.......k...s.s.'},
 // ボス：半音でせり上がる甲高い悲鳴と、休みなく叩きつけるベース
 boss:{bpm:150,lead:'sawtooth',cut:2600,melLen:0.9,
  mel:[74,73,74,0, 80,0,79,0, 74,73,74,0, 75,77,78,80, 81,80,81,0, 86,0,85,0, 80,79,80,0, 75,74,73,74],
  bass:gallop([38,39,38,44],32,[0,1,2,3,4,5,6,7]),
  drone:[26,32],
  drum:'K.s.k.s.k.s.k.sskks.k.s.k.s.k.ss'}
};
let bgm=null,bgmStep=0,bgmNext=0;
function playBGM(n){bgm=n;bgmStep=0;if(AC)bgmNext=AC.currentTime+0.05;}
function stopBGM(){bgm=null;}
function musicTick(){
 if(!AC||muted||!bgm)return;const s=SONGS[bgm],dt=60/s.bpm/2,N=s.mel.length;
 if(bgmNext<AC.currentTime)bgmNext=AC.currentTime+0.02;
 while(bgmNext<AC.currentTime+0.15){
  const i=bgmStep%N,w=bgmNext-AC.currentTime,m=s.mel[i];
  if(m)voice(mf(m),dt*s.melLen,{type:s.lead,v:0.06,when:w,det:9,cut:s.cut});
  const b=s.bass[i];if(b)voice(mf(b),dt*0.9,{type:'sawtooth',v:0.16,when:w,det:6,cut:480});
  if(i%16===0)s.drone.forEach(n=>voice(mf(n),dt*16.5,{type:'sawtooth',v:0.05,when:w,det:15,cut:320,att:0.8}));
  const d=s.drum[i];
  if(d==='k'||d==='K')tone(95,0.3,'sine',0.55,-60,w);
  if(d==='K')bell(mf(62),w);
  if(d==='s')noise(0.1,0.1,w);
  bgmNext+=dt;bgmStep++;
 }
}
function jingle(notes,dt){notes.forEach((m,i)=>{if(m)voice(mf(m),dt*1.1,{type:'sawtooth',v:0.09,when:i*dt,det:8,cut:1800});});}

/* ===== ステージ ===== */
const G=0.32,JV=-6,SPD=1.4,GY=144,LEVEL_W=3264,ARENA=LEVEL_W-W;
const solids=[];
[[0,700],[740,1300],[1340,1900],[1940,LEVEL_W]].forEach(([a,b])=>solids.push({x:a,y:GY,w:b-a,h:40,t:'g'}));
[[400,108,64],[1050,104,80],[1480,104,64],[1560,80,48],[2280,104,96],[2420,84,48]].forEach(([x,y,w])=>solids.push({x,y,w,h:8,t:'p'}));
const tombX=[180,330,520,880,1000,1180,1420,1660,1780,2060,2200,2500,2620,2800];
tombX.forEach(x=>solids.push({x,y:GY-18,w:14,h:18,t:'tomb'}));
const crowTombs=[330,1000,2200,2620];
const CP_X=1600;

let contT=0,continues=0,state='title',stateT=0,frame=0,score=0,lives=2,hi=0,timeLeft=0,camX=0,checkpoint=24,cpReached=false;
let bossLock=false,demonSpawned=false,clearT=0,shake=0,msg='',msgT=0,zTimer=0;
let ghost=null,allyShots=[],player,shots=[],enemies=[],eshots=[],parts=[],items=[],pots=[];
try{hi=+localStorage.getItem('hakaba_hi')||0}catch(_){}

const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function move(e){
 e.hitWall=false;e.x+=e.vx;
 for(const s of solids)if(overlap(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;e.hitWall=true;}
 e.y+=e.vy;e.onGround=false;
 for(const s of solids)if(overlap(e,s)){if(e.vy>0){e.y=s.y-e.h;e.vy=0;e.onGround=true;}else if(e.vy<0){e.y=s.y+s.h;e.vy=0;}}
}
function hasGround(x){return solids.some(s=>s.t==='g'&&x>=s.x&&x<=s.x+s.w);}
function spawnOK(x,w){
 if(!hasGround(x)||!hasGround(x+w))return false;
 return !solids.some(s=>s.t==='tomb'&&x<s.x+s.w+2&&x+w>s.x-2);
}
function burst(x,y,n,cols,sp=2,g=0.12){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*sp*2,vy:(Math.random()-.8)*sp*1.5,l:25+Math.random()*20,c:cols[i%cols.length],g});}

function newGame(){ghost=null;score=0;lives=2;checkpoint=24;cpReached=false;startLife();}
function startLife(){
 pots=[[600,'dagger'],[940,'ghost'],[1240,'armor'],[2130,'gem'],[2700,'armor']].map(([x,c])=>({x,y:GY-12,w:12,h:12,c,alive:true}));
 player={x:checkpoint,y:GY-22,w:12,h:22,vx:0,vy:0,dir:1,onGround:true,armor:true,inv:60,st:'alive',dt:0,weapon:'lance',cool:0,throwT:0,crouch:false};
 enemies=[];shots=[];eshots=[];items=[];parts=[];allyShots=[];
 if(ghost){ghost.x=player.x-12;ghost.y=player.y-16;}
 crowTombs.forEach(tx=>{if(tx>checkpoint+60)enemies.push({type:'crow',x:tx+1,y:GY-28,w:12,h:10,hp:1,st:'perch',t:0,vx:0,by:0});});
 demonSpawned=false;bossLock=false;clearT=0;timeLeft=180*60;zTimer=90;
 camX=Math.max(0,Math.min(LEVEL_W-W,player.x-W/2));
 state='play';stateT=0;jumpPressed=firePressed=false;playBGM('stage');
}
function die(){
 const p=player;if(p.st!=='alive')return;
 p.st='dead';p.dt=0;p.vy=-4;p.vx=0;stopBGM();sfx('die');try{navigator.vibrate&&navigator.vibrate(120)}catch(_){}
}
function hurt(){
 const p=player;
 if(p.armor){
  p.armor=false;p.inv=100;p.vy=-3.5;p.vx=-p.dir*1.3;p.onGround=false;sfx('armor');
  burst(p.x+6,p.y+8,10,['#dfe5ec','#aab4c0','#d23'],2.2);try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}
 }else die();
}
function harmful(e){
 if(e.type==='zombie')return e.st==='walk'||e.st==='fall'||(e.st==='rise'&&e.t>16)||(e.st==='sink'&&e.t<20);
 return true;
}
function killEnemy(e){
 e.dead=true;const pts={zombie:100,crow:100,demon:1000,boss:10000}[e.type];score+=pts;
 if(e.type==='boss'){
  for(let i=0;i<6;i++)burst(e.x+Math.random()*32,e.y+Math.random()*48,10,['#fa0','#ff4','#c22','#fff'],3);
  shake=30;noise(1,0.6);eshots=[];clearT=1;stopBGM();
  enemies.forEach(o=>{if(o!==e&&!o.dead){o.dead=true;burst(o.x+6,o.y+6,6,['#fa0','#fff']);}});
 }else burst(e.x+e.w/2,e.y+e.h/2,10,['#fa0','#ff4','#fff'],2);
 sfx('kill');
}
function saveHi(){if(score>hi){hi=score;try{localStorage.setItem('hakaba_hi',hi)}catch(_){}}}

/* ===== 更新 ===== */
function updatePlayer(){
 const p=player;
 if(p.st==='dead'){
  p.dt++;p.vy+=0.2;p.y+=p.vy;
  if(p.dt>110){lives--;if(lives<0){state='continue';stateT=0;contT=600;saveHi();bell(mf(50));}else startLife();}
  return;
 }
 p.crouch=p.onGround&&keys.down;
 if(p.onGround){
  p.vx=p.crouch?0:keys.left?-SPD:keys.right?SPD:0;
  if(jumpPressed){p.vy=JV;p.onGround=false;p.crouch=false;sfx('jump');}
 }
 if(keys.left)p.dir=-1;if(keys.right)p.dir=1; // 空中でも向きだけは変えられる（軌道は変わらない）
 if(p.cool>0)p.cool--;if(p.throwT>0)p.throwT--;if(p.inv>0)p.inv--;
 if(firePressed&&p.cool<=0&&clearT===0){
  const d=p.weapon==='dagger',max=d?3:2;
  if(shots.length<max){
   const w=d?10:16;shots.push({x:p.dir>0?p.x+6:p.x+6-w,y:p.crouch?p.y+p.h-6:p.y+9,w,h:d?3:4,vx:p.dir*(d?5.5:4.2),k:p.weapon});
   p.cool=d?9:15;p.throwT=10;sfx('throw');
  }
 }
 p.vy=Math.min(6,p.vy+G);
 move(p);
 if(p.x<0)p.x=0;if(p.x>LEVEL_W-p.w)p.x=LEVEL_W-p.w;
 if(bossLock&&p.x<ARENA)p.x=ARENA;
 if(p.y>H+20){p.armor=false;die();}
}
function trySpawnZombie(){
 const p=player;if(bossLock||p.x>2880||p.st!=='alive'||clearT)return;
 if(enemies.filter(e=>e.type==='zombie').length>=4)return;
 const side=Math.random()<0.65?p.dir:-p.dir;const x=Math.round(p.x+side*(45+Math.random()*95));
 if(x<camX+4||x>camX+W-16||Math.abs(x-p.x)<30||!spawnOK(x,12))return;
 enemies.push({type:'zombie',x,y:GY-22,w:12,h:22,hp:1,st:'rise',t:0,vx:0,vy:0});
}
function updateEnemy(e){
 const p=player;e.t++;if(e.flash>0)e.flash--;
 switch(e.type){
 case'zombie':
  if(e.st==='rise'){if(e.t%6===0)burst(e.x+6,GY-1,2,['#4a3626','#2d4f2a'],1);if(e.t>=40){e.st='walk';e.t=0;e.vx=(p.x<e.x?-1:1)*(0.45+Math.random()*0.3);}}
  else if(e.st==='walk'){
   e.x+=e.vx;
   for(const s of solids)if(s.t==='tomb'&&overlap(e,s)){e.x-=e.vx;e.vx=-e.vx;break;}
   if(!hasGround(e.x+6)){e.st='fall';e.vy=0;}
   if(e.t>520){e.st='sink';e.t=0;}
  }else if(e.st==='sink'){if(e.t>=40)e.dead=true;}
  else if(e.st==='fall'){e.vy+=G;e.y+=e.vy;e.x+=e.vx;if(e.y>H)e.dead=true;}
  if(e.x<camX-80||e.x>camX+W+80)e.dead=true;
  break;
 case'crow':
  if(e.st==='perch'){if(Math.abs(p.x-e.x)<100&&p.st==='alive'){e.st='fly';e.vx=(p.x<e.x?-1:1)*1.3;e.by=e.y;e.t=0;sfx('crow');}}
  else{e.x+=e.vx;e.by+=((p.y+6)-e.by)*0.015;e.y=e.by+Math.sin(e.t*0.12)*14;if(e.x<camX-40||e.x>camX+W+40)e.dead=true;}
  break;
 case'demon':
  if(e.st==='hover'){
   const cx=e.x+e.w/2,tx=p.x+6+(cx<p.x+6?-80:80)-e.w/2,ty=Math.max(14,p.y-e.h-18);
   e.x+=Math.sign(tx-e.x)*Math.min(0.7,Math.abs(tx-e.x));e.y+=Math.sign(ty-e.y)*Math.min(0.5,Math.abs(ty-e.y));
   if(e.t>90&&p.st==='alive'){e.st='dive';e.t=0;const dx=p.x+6-(e.x+e.w/2),dy=p.y+10-(e.y+e.h/2),l=Math.hypot(dx,dy)||1;e.vx=dx/l*1.5;e.vy=dy/l*1.5;sfx('dive');}
  }else{e.x+=e.vx;e.y+=e.vy;if(e.y>GY-e.h){e.y=GY-e.h;e.vy=-Math.abs(e.vy);}if(e.t>90){e.st='hover';e.t=0;}}
  break;
 case'boss':
  e.face=p.x<e.x+10?-1:1;e.vy+=0.25;
  if(e.onGround){
   if(!e.landed){e.landed=true;shake=12;sfx('land');}
   e.vx=e.face*0.45;
   if(e.t>100){e.t=0;
    if(Math.random()<0.5){e.vy=-5.5;e.vx=e.face*1.6;e.landed=false;}
    else{for(let i=0;i<3;i++)eshots.push({x:e.x+12,y:e.y+10,w:8,h:8,vx:e.face*(1.1+i*0.7),vy:-3.2-i*0.4});sfx('fire');}
   }
  }
  move(e);
  if(e.x<ARENA){e.x=ARENA;}if(e.x>LEVEL_W-e.w){e.x=LEVEL_W-e.w;}
  break;
 }
}
/* ===== 仲間の幽霊 ===== */
function ghostVanish(){
 const g=ghost;g.gone=600; // 10秒
 burst(g.x+6,g.y+7,14,['#e8f0ff','#9cf','#5a6aa8'],1.8,-0.03);sfx('goff');
}
function updateGhost(){
 const g=ghost,p=player;if(!g)return;
 // 幽霊の炎
 for(const s of allyShots){

  for(const e of enemies){

   if(overlap(s,e)){s.dead=true;e.hp--;e.flash=6;if(e.hp<=0)killEnemy(e);else{sfx('hit');burst(s.x+4,s.y+4,4,['#fff','#9cf'],1);}break;}
  }
 }
 allyShots=allyShots.filter(s=>!s.dead);
 if(g.gone>0){
  if(--g.gone===0){g.x=p.x+6-p.dir*18-6;g.y=p.y-16;burst(g.x+6,g.y+7,14,['#e8f0ff','#9cf','#fff'],1.5,0);sfx('gback');}
  return;
 }
 if(p.st!=='alive')return;
 g.t++;
 // 騎士の背中側の少し上をフワフワついて回る
 const tx=p.x+6-p.dir*18-6,ty=p.y-16+Math.sin(g.t*0.07)*5;
 g.x+=(tx-g.x)*0.06;g.y+=(ty-g.y)*0.06;
 if(g.cool>0)g.cool--;
 else if(clearT===0){
  let best=null,bd=150;
  for(const e of enemies){
   if(e.dead||(e.type==='zombie'&&(e.st==='rise'&&e.t<16||e.st==='sink')))continue;
   const ex=e.x+e.w/2,ey=e.y+e.h/2;if(ex<camX||ex>camX+W)continue;
   const d=Math.hypot(ex-(g.x+6),ey-(g.y+7));if(d<bd){bd=d;best=e;}
  }
  if(best){
   const dx=best.x+best.w/2-(g.x+6),dy=best.y+best.h/2-(g.y+7),l=Math.hypot(dx,dy)||1;
   allyShots.push({x:g.x+2,y:g.y+3,w:8,h:8,vx:dx/l*3,vy:dy/l*3,l:90});
   g.dir=dx<0?-1:1;g.cool=70;sfx('gfire');

 }
 // 敵や敵の火の玉にぶつかると10秒消える
 const hb={x:g.x+1,y:g.y+1,w:10,h:12};
 for(const e of enemies)if(!e.dead&&harmful(e)&&overlap(hb,e)){ghostVanish();return;}

function updatePlay(){
 const p=player;
 if(p.st==='alive'&&clearT===0){timeLeft--;if(timeLeft<=0){p.armor=false;die();}}
 updatePlayer();
 if(state!=='play')return;
 if(!cpReached&&p.x>CP_X){cpReached=true;checkpoint=CP_X;msg='チェックポイント';msgT=90;sfx('pickup');}
 if(!demonSpawned&&p.x>2280){demonSpawned=true;enemies.push({type:'demon',x:camX+W+10,y:14,w:48,h:48,hp:6,st:'hover',t:0,vx:0,vy:0});msg='レッドデーモン襲来！';msgT=90;}
 if(!bossLock&&p.x>ARENA+40&&p.st==='alive'){bossLock=true;enemies.push({type:'boss',x:LEVEL_W-50,y:-60,w:32,h:48,hp:16,t:0,vx:0,vy:0,face:-1,landed:false});playBGM('boss');msg='墓守の巨人';msgT=100;}
 if(--zTimer<=0){trySpawnZombie();zTimer=75+Math.random()*88;}
 updateGhost();
 // 自分の攻撃
 for(const s of shots){
  s.x+=s.vx;
  if(s.x<camX-24||s.x>camX+W+24){s.dead=true;continue;}
  for(const t of solids)if(t.t==='tomb'&&overlap(s,t)){s.dead=true;burst(s.x+s.w/2,s.y,4,['#fff','#ccc'],1.5);sfx('tink');break;}
  if(s.dead)continue;
  for(const pt of pots)if(pt.alive&&overlap(s,pt)){
   pt.alive=false;s.dead=true;sfx('pot');burst(pt.x+6,pt.y+6,8,['#b5703e','#7a4426'],1.8);
   items.push({x:pt.x+1,y:pt.y-4,w:10,h:10,vx:0,vy:-3,k:pt.c,t:0});break;
  }
  if(s.dead)continue;
  for(const e of enemies){
   if(e.dead||(e.type==='zombie'&&e.st==='rise'&&e.t<10))continue;
   if(overlap(s,e)){s.dead=true;e.hp--;e.flash=6;if(e.hp<=0)killEnemy(e);else{sfx('hit');burst(s.x+s.w/2,s.y,3,['#fff','#fa0'],1);}break;}
  }
 }
 for(const e of enemies)if(!e.dead)updateEnemy(e);
 for(const f of eshots){f.vy+=0.14;f.x+=f.vx;f.y+=f.vy;if(f.y>GY-8){f.dead=true;burst(f.x+4,GY-2,5,['#fa0','#f40'],1.5);}if(f.x<camX-20||f.x>camX+W+20)f.dead=true;}
 for(const it of items){
  it.t++;it.vy=Math.min(5,it.vy+G);move(it);if(it.y>H)it.dead=true;
  if(it.t>720)it.dead=true;
  if(p.st==='alive'&&overlap(p,it)){
   it.dead=true;sfx('pickup');
   if(it.k==='armor'){if(p.armor){score+=500;}else{p.armor=true;burst(p.x+6,p.y+10,10,['#fff','#ff8'],1.5);}msg=p.armor?'よろい装備！':'';msgT=60;}
   else if(it.k==='gem'){score+=1000;}
   else if(it.k==='ghost'){if(ghost&&ghost.gone===0)score+=500;else{ghost={x:it.x,y:it.y-10,t:0,cool:40,gone:0,dir:p.dir};burst(it.x+5,it.y,14,['#e8f0ff','#9cf','#fff'],1.5,0);}sfx('gget');msg='幽霊の仲間が加わった！';msgT=90;}
   else{p.weapon=it.k;score+=200;msg=it.k==='dagger'?'短剣（連射できる）':'やり';msgT=60;}
  }
 }
 for(const q of parts){q.vy+=q.g;q.x+=q.vx;q.y+=q.vy;q.l--;}
 // 被弾判定
 if(p.st==='alive'&&p.inv<=0){
  const hb=p.crouch?{x:p.x+2,y:p.y+11,w:p.w-4,h:p.h-11}:{x:p.x+2,y:p.y+3,w:p.w-4,h:p.h-3};
  let hit=false;
  for(const e of enemies)if(!e.dead&&harmful(e)&&overlap(hb,e)){hit=true;break;}
  if(!hit)for(const f of eshots)if(!f.dead&&overlap(hb,f)){hit=true;f.dead=true;break;}
  if(hit)hurt();
 }
 // カメラ
 let target=bossLock?ARENA:p.x-W/2+6;camX+=(target-camX)*0.15;camX=Math.max(0,Math.min(LEVEL_W-W,camX));
 shots=shots.filter(s=>!s.dead);enemies=enemies.filter(e=>!e.dead);eshots=eshots.filter(f=>!f.dead);
 items=items.filter(i=>!i.dead);parts=parts.filter(q=>q.l>0);
 if(clearT>0){clearT++;if(clearT===60)jingle([62,66,69,74,0,74,76,78,0,81],0.14);if(clearT>200){score+=Math.floor(timeLeft/60)*10;state='clear';stateT=0;saveHi();}}
 if(msgT>0)msgT--;if(shake>0)shake--;
}
function update(){

}

}

 for(let i=0;i<20;i++){const x=(r()*186)|0,y=(6+r()*30)|0,w=(2+r()*4)|0;g.fillStyle='#5a4a3e';g.fillRect(x,y,w,2);g.fillStyle='#75634f';g.fillRect(x,y,w-1,1);g.fillStyle='#1e150e';g.fillRect(x,y+2,w,1);}
 g.fillStyle='#cfc6b0';g.fillRect(118,17,7,1);g.fillRect(117,16,1,3);g.fillRect(125,16,1,3);
 paint(g,SKULL,{W:'#d8d0bc',K:'#1a1010'},34,27);
 const gr=g.createLinearGradient(0,0,0,40);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=gr;g.fillRect(0,0,64,40);
 return c;})();

 for(let x=0;x<64;x++){const h=(1+r()*3.5)|0;g.fillStyle='#2a4a28';g.fillRect(x,3,1,3+(r()<.3?1:0));g.fillStyle=r()<.5?'#3d6a35':'#355e2f';g.fillRect(x,3-h,1,h+1);if(r()<.15){g.fillStyle='#6aa850';g.fillRect(x,3-h,1,1);}}
 return c;})();

 [[1,0,7,3],[9,0,6,3],[0,4,3,3],[4,4,7,3],[12,4,4,3]].forEach(([x,y,w,h])=>{g.fillStyle='#726c7c';g.fillRect(x,y,w,h);g.fillStyle='#8f899b';g.fillRect(x,y,w,1);g.fillStyle='#57515f';g.fillRect(x,y+h-1,w,1);});
 g.fillStyle='#4f7a3a';g.fillRect(2,0,3,1);g.fillRect(11,0,2,1);return c;})();
const MOON=(()=>{const c=cnv(32,32),g=c.getContext('2d'),gr=g.createRadialGradient(12,12,2,16,16,16);gr.addColorStop(0,'#fff8e4');gr.addColorStop(1,'#d6c69e');
 g.fillStyle=gr;g.beginPath();g.arc(16,16,15,0,7);g.fill();g.fillStyle='rgba(150,130,100,.35)';
 [[10,11,3],[20,18,4],[13,22,2],[22,9,2]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill();});return c;})();
const CLOUD=(()=>{const c=cnv(96,18),g=c.getContext('2d');
 [[20,10,18,5],[44,8,22,6],[70,11,18,5],[52,12,30,5]].forEach(([x,y,rx,ry])=>{g.fillStyle='rgba(58,38,82,.9)';g.beginPath();g.ellipse(x,y-1,rx,ry,0,0,7);g.fill();g.fillStyle='rgba(28,16,44,.95)';g.beginPath();g.ellipse(x,y+1,rx,ry,0,0,7);g.fill();});return c;})();
const CASTLE=(()=>{const c=cnv(120,106),g=c.getContext('2d');g.fillStyle='#150e28';
 g.beginPath();g.moveTo(0,106);g.lineTo(18,86);g.lineTo(34,88);g.lineTo(44,76);g.lineTo(82,74);g.lineTo(96,84);g.lineTo(120,106);g.fill();
 g.fillRect(30,56,62,24);for(let x=30;x<92;x+=4)g.fillRect(x,53,2,3);
 const tw=[[24,42,10,40],[50,30,12,48],[64,20,10,58],[86,38,10,42]];
 tw.forEach(([x,y,w,h])=>{g.fillStyle='#150e28';g.fillRect(x,y,w,h);g.beginPath();g.moveTo(x-2,y);g.lineTo(x+w/2,y-14);g.lineTo(x+w+2,y);g.fill();g.fillStyle='#231a40';g.fillRect(x+w-2,y,2,h);});
 g.fillStyle='#150e28';g.fillRect(68,0,1,8);g.fillStyle='#5a1020';g.fillRect(69,0,4,3);return c;})();
const CASTLE_WIN=[[28,50],[55,40],[57,52],[68,30],[69,46],[90,46],[40,64],[78,64]];
const MID=(()=>{const c=cnv(560,80),g=c.getContext('2d'),r=seeded(11);g.fillStyle='#0f0b1c';
 const line=(x0,y0,x1,y1,t)=>{const n=Math.max(1,Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n,y=y0+(y1-y0)*i/n;g.fillRect(Math.round(x-t/2),Math.round(y),Math.max(1,Math.round(t)),1);}};
 const br=(x,y,len,ang,t,d)=>{const x1=x+Math.cos(ang)*len,y1=y+Math.sin(ang)*len;line(x,y,x1,y1,t);if(d>0){br(x1,y1,len*0.72,ang-0.45-r()*0.4,t*0.62,d-1);br(x1,y1,len*0.66,ang+0.35+r()*0.45,t*0.62,d-1);}};
 [[50,1],[200,0.8],[345,1.15],[480,0.85]].forEach(([x,s])=>br(x,80,22*s,-Math.PI/2+(r()-.5)*0.25,5*s,4));
 for(let x=100;x<172;x+=7){g.fillRect(x,58,2,22);g.fillRect(x,56+(x%3),1,2);}g.fillRect(100,63,72,1);g.fillRect(100,70,72,1);
 [[260,58],[290,64],[410,56],[430,63]].forEach(([x,y])=>{g.fillRect(x,y,2,80-y);g.fillRect(x-3,y+4,8,2);});
 for(let x=0;x<560;x++){const h=(3+Math.sin(x*0.05)*2+r()*3)|0;g.fillRect(x,80-h,1,h);}
 return c;})();
const FOG=(()=>{const c=cnv(256,40),g=c.getContext('2d'),r=seeded(5);
 for(let i=0;i<34;i++){const x=r()*256,y=12+r()*20,rad=10+r()*16;for(const ox of[-256,0,256]){const gr=g.createRadialGradient(x+ox,y,0,x+ox,y,rad);gr.addColorStop(0,'rgba(150,130,185,.22)');gr.addColorStop(1,'rgba(150,130,185,0)');g.fillStyle=gr;g.fillRect(x+ox-rad,y-rad,rad*2,rad*2);}}
 return c;})();
const VIGNETTE=(()=>{const c=cnv(W,H),g=c.getContext('2d'),gr=g.createRadialGradient(W/2,H/2,60,W/2,H/2,170);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=gr;g.fillRect(0,0,W,H);return c;})();
const GLOW=(()=>{const c=cnv(32,32),g=c.getContext('2d'),gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(255,150,60,.55)');gr.addColorStop(1,'rgba(255,150,60,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);return c;})();
const GLOW_G=(()=>{const c=cnv(32,32),g=c.getContext('2d'),gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(120,255,140,.5)');gr.addColorStop(1,'rgba(120,255,140,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);return c;})();
const STARS=(()=>{const r=seeded(3),a=[];for(let i=0;i<70;i++)a.push([r()*W,r()*92,r()]);return a;})();
const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#05040f');sky.addColorStop(0.5,'#1c1036');sky.addColorStop(0.85,'#4a1c3a');sky.addColorStop(1,'#5c2238');
const pitGrad=ctx.createLinearGradient(0,GY-6,0,H);pitGrad.addColorStop(0,'rgba(0,0,0,0)');pitGrad.addColorStop(1,'#000');
function glow(img,x,y,s=32){ctx.save();ctx.globalCompositeOperation='lighter';ctx.drawImage(img,Math.round(x-s/2),Math.round(y-s/2),s,s);ctx.restore();}

function drawBG(){
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(const[x,y,b]of STARS){const tw=Math.sin(frame*0.05+b*40)*.5+.5;ctx.globalAlpha=0.25+0.75*tw*b;R(((x-camX*0.03)%W+W)%W,y,1,1,b>0.85?'#fff8e0':'#a8a0d0');}
 ctx.globalAlpha=1;
 const mg=ctx.createRadialGradient(200,34,10,200,34,64);mg.addColorStop(0,'rgba(255,225,190,.3)');mg.addColorStop(1,'rgba(255,225,190,0)');ctx.fillStyle=mg;ctx.fillRect(130,0,126,100);
 ctx.drawImage(MOON,184,18);
 for(let i=0;i<3;i++){const cx=((i*150+60-frame*0.12-camX*0.08)%450+450)%450-110;ctx.drawImage(CLOUD,Math.round(cx),14+i*13);}
 const cx=Math.round(250-camX*0.055);ctx.drawImage(CASTLE,cx,16);
 for(const[wx,wy]of CASTLE_WIN){const f=Math.sin(frame*0.13+wx)>-.3;R(cx+wx,16+wy,1,2,f?'#ffb040':'#b05020');}
 ctx.fillStyle='#1a1430';ctx.beginPath();ctx.moveTo(0,H);
 for(let x=0;x<=W;x+=4){const wx=x+camX*0.2;ctx.lineTo(x,108-Math.sin(wx*0.02)*10-Math.sin(wx*0.051)*6);}ctx.lineTo(W,H);ctx.fill();
 const off=camX*0.5;for(let x=-(off%560);x<W;x+=560)ctx.drawImage(MID,Math.round(x),GY-78);
 const fo=(frame*0.2+camX*0.6)%256;ctx.globalAlpha=0.9;for(let x=-fo;x<W;x+=256)ctx.drawImage(FOG,Math.round(x),GY-36);ctx.globalAlpha=1;
 if(flashT>0){ctx.fillStyle=`rgba(190,180,255,${flashT/12*0.35})`;ctx.fillRect(0,0,W,H);}
}
function drawSolids(){
 ctx.fillStyle=pitGrad;ctx.fillRect(0,GY-6,W,H-GY+6);
 for(const s of solids){
  const sx=Math.round(s.x-camX);if(sx>W||sx+s.w<0)continue;
  if(s.t==='g'){
   const a=Math.floor(Math.max(s.x,camX)/192)*192,b=Math.min(s.x+s.w,camX+W);
   ctx.save();ctx.beginPath();ctx.rect(sx,s.y-5,s.w,H);ctx.clip();
   for(let x=a;x<b;x+=192){ctx.drawImage(GROUND,Math.round(x-camX),s.y);for(let k=0;k<192;k+=64)ctx.drawImage(GRASS,Math.round(x+k-camX),s.y-3);}
   ctx.restore();
   R(sx,s.y+2,1,H,'#140c08');R(sx+s.w-1,s.y+2,1,H,'#140c08');
  }else if(s.t==='p'){
   ctx.save();ctx.beginPath();ctx.rect(sx,s.y,s.w,s.h);ctx.clip();
   for(let x=0;x<s.w;x+=16)ctx.drawImage(PLAT,sx+x,s.y);ctx.restore();
   R(sx,s.y+s.h,s.w,2,'rgba(0,0,0,.45)');R(sx-1,s.y,1,s.h,OUT);R(sx+s.w,s.y,1,s.h,OUT);
  }else dS(TOMB[((s.x*7)>>4)%2],sx,s.y);
 }
 const lx=Math.round(CP_X-camX);
 if(lx>-20&&lx<W+20){R(lx,GY-26,3,26,'#3a3440');R(lx+1,GY-26,1,26,'#5a5266');R(lx-3,GY-33,9,8,OUT);
  const fl=frame%10<5,on=cpReached;R(lx-2,GY-32,7,6,on?(fl?'#7f7':'#3c3'):(fl?'#fb4':'#e70'));R(lx,GY-31,3,3,'#fff6c0');
  glow(on?GLOW_G:GLOW,lx+1,GY-29,fl?40:36);}
}
function drawPlayer(){
 const p=player;if(p.inv>0&&frame%4<2&&p.st==='alive')return;
 if(p.crouch&&p.st==='alive'){dS(KN[(p.armor?1:0)+'kneel'+(p.throwT>0?1:0)],p.x-camX-2,p.y+p.h-18,p.dir);return;}
 const lg=!p.onGround?'jump':(p.vx!==0&&Math.floor(frame/7)%2?'walk':'idle');
 dS(KN[(p.armor?1:0)+lg+(p.throwT>0?1:0)],p.x-camX-2,p.y-1,p.dir);
}
function drawZombie(e){
 const sx=e.x-camX,d=e.vx<0?-1:e.vx>0?1:(player.x<e.x?-1:1);
 const s=ZOM[e.st==='walk'?Math.floor(frame/10)%2:0];
 let vh=24;if(e.st==='rise')vh=Math.min(24,24*e.t/40);else if(e.st==='sink')vh=Math.max(0,24*(1-e.t/40));
 if(vh<24){ctx.save();ctx.beginPath();ctx.rect(Math.round(sx)-6,GY-vh,28,vh);ctx.clip();dS(s,sx-2,GY-23,d,e.flash>0);ctx.restore();R(sx-2,GY-2,16,2,'#4a3626');R(sx,GY-3,12,1,'#3a2a20');}
 else dS(s,sx-2,e.y-1,d,e.flash>0&&frame%2);
}
function drawEnemy(e){
 const sx=e.x-camX,sy=e.y;if(sx<-60||sx>W+60)return;
 const fl=e.flash>0&&frame%2===1;
 if(e.type==='zombie')return drawZombie(e);
 if(e.type==='crow'){const d=e.vx<0?-1:e.vx>0?1:(player.x<e.x?-1:1);dS(e.st==='perch'?CROW.perch:(Math.floor(frame/5)%2?CROW.up:CROW.down),sx-2,sy-1,d,fl);return;}
 if(e.type==='demon'){glow(GLOW,sx+24,sy+20,70);dS(DEMON[Math.floor(frame/8)%2],sx,sy,1,fl,2);return;}
 if(e.type==='boss'){
  dS(BOSS,sx,sy+(e.onGround&&Math.floor(frame/12)%2?1:0),1,fl);
  R(W/2-31,16,62,5,OUT);R(W/2-30,17,60,3,'#300');R(W/2-30,17,60*e.hp/16,3,'#f33');R(W/2-30,17,60*e.hp/16,1,'#f88');
 }
}
function drawItem(it){
 if(it.t>600&&frame%6<3)return;const sx=it.x-camX,sy=it.y;
 if(it.k==='ghost'){glow(GLOW_B,sx+5,sy+2,30);ctx.globalAlpha=0.9;dS(GHOST[Math.floor(frame/12)%2],sx-1,sy-6+Math.sin(frame*0.1)*2);ctx.globalAlpha=1;}
 else if(it.k==='armor'||it.k==='gem'){if(frame%40<20)glow(GLOW,sx+5,sy+5,22);dS(ITEM[it.k],sx,sy);}
 else if(it.k==='dagger')dS(DAGGER,sx,sy+3);else dS(LANCE,sx-3,sy+3);
}
function drawHUD(){
 const F='Verdana,Arial,sans-serif';
 R(0,0,W,13,'rgba(8,4,16,.75)');R(0,13,W,1,'#3a2a50');
 T('SCORE',4,2,'#c8b8e8',9,'left',F);T(String(score).padStart(6,'0'),40,2,'#fff',9,'left',F);
 const s=Math.max(0,Math.ceil(timeLeft/60));T('TIME',104,2,'#c8b8e8',9,'left',F);T(Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),132,2,s<30&&frame%30<15?'#f55':'#ffd860',9,'left',F);
 ctx.drawImage(KN['1idle0'].n,0,0,16,10,164,2,16,10);T('×'+Math.max(0,lives),180,2,'#fff',9,'left',F);
 if(player.weapon==='dagger')dS(DAGGER,200,4);else dS(LANCE,198,4);
 if(ghost){ctx.globalAlpha=ghost.gone?0.35:1;ctx.drawImage(GHOST[0].n,0,0,12,11,220,1,12,11);ctx.globalAlpha=1;if(ghost.gone)T(String(Math.ceil(ghost.gone/60)),234,2,'#9cf',9,'left','Verdana,Arial,sans-serif');}
}
function drawWorld(){
 ctx.save();if(shake>0)ctx.translate(Math.round((Math.random()-.5)*4),Math.round((Math.random()-.5)*4));
 drawBG();drawSolids();
 for(const pt of pots)if(pt.alive)dS(POT,pt.x-camX,pt.y);
 items.forEach(drawItem);enemies.forEach(drawEnemy);
 if(state==='play')drawPlayer();
 for(const s of allyShots){const sx=s.x-camX;glow(GLOW_B,sx+4,s.y+4,26);dS(GFIRE[(frame>>2)%2],sx,s.y);}
 if(ghost&&ghost.gone===0&&state==='play'){glow(GLOW_B,ghost.x-camX+6,ghost.y+7,36);ctx.globalAlpha=0.88;dS(GHOST[Math.floor(frame/12)%2],ghost.x-camX,ghost.y,ghost.dir);ctx.globalAlpha=1;}
 for(const s of shots){const sx=s.x-camX,d=Math.sign(s.vx);if(s.k==='dagger')dS(DAGGER,sx,s.y-1,d);else dS(LANCE,sx,s.y,d);}
 for(const f of eshots){const sx=f.x-camX;glow(GLOW,sx+4,f.y+4,28);dS(FIRE[(frame>>2)%2],sx,f.y);}
 for(const q of parts){ctx.globalAlpha=Math.min(1,q.l/15);R(q.x-camX,q.y,2,2,q.c);}ctx.globalAlpha=1;
 const fo=(frame*0.35+camX*1.1)%256;ctx.globalAlpha=0.6;for(let x=-fo;x<W;x+=256)ctx.drawImage(FOG,Math.round(x),GY-22);ctx.globalAlpha=1;
 ctx.drawImage(VIGNETTE,0,0);
 ctx.restore();
}
function draw(){
 ctx.imageSmoothingEnabled=false;
 if(state==='title'){
  camX=(frame*0.4)%(LEVEL_W-W-400);drawBG();drawSolids();ctx.drawImage(VIGNETTE,0,0);
  R(0,0,W,H,'rgba(0,0,0,.35)');
  TG('墓場の騎士',W/2,30,'#ff3a3a',26,'center','#f00');TG('〜魔王城への道〜',W/2,64,'#ffd8a8',11,'center','#a40');
  if(frame%60<40)T('タップでスタート',W/2,96,'#fff',12,'center');
  T('◀▶ 移動 / ▼ 膝立ち / ジャンプ / 攻撃',W/2,124,'#ccc',10,'center');
  T('ジャンプ中は方向を変えられないぞ！',W/2,140,'#aaa',9,'center');
  if(hi)T('HI '+hi,W/2,158,'#ff8',8,'center');
  return;
 }
 drawWorld();drawHUD();
 if(msgT>0&&msg&&state==='play')TG(msg,W/2,40,'#ffe080',12,'center','#a40');
 if(state==='continue'){const n=Math.max(0,Math.ceil(contT/60)-1);R(0,0,W,H,'rgba(0,0,0,.6)');
  TG('コンティニュー？',W/2,34,'#ffe080',18,'center','#f80');
  TG(String(n),W/2,62,n<=3?'#ff4040':'#ffffff',36,'center',n<=3?'#f00':'#a6f');
  if(stateT>40&&frame%40<28)T('タップでつづける',W/2,112,'#fff',12,'center');
  T('チェックポイントから再開・スコアは0にもどります',W/2,134,'#bbb',8,'center');
  if(hi)T('HI '+hi,W/2,152,'#ff8',8,'center');}
 if(state==='over'){R(0,0,W,H,'rgba(0,0,0,.55)');TG('GAME OVER',W/2,60,'#ff3a3a',22,'center','#f00');T('SCORE '+score+'  HI '+hi,W/2,94,'#fff',9,'center');if(stateT>40&&frame%60<40)T('タップでリトライ',W/2,118,'#fff',12,'center');}
 if(state==='clear'){R(0,0,W,H,'rgba(0,0,0,.55)');TG('ステージクリア！',W/2,50,'#ffe080',20,'center','#f80');T('魔王城への道が開かれた…',W/2,80,'#fda',11,'center');T('SCORE '+score+'  HI '+hi,W/2,102,'#fff',9,'center');if(stateT>40&&frame%60<40)T('タップでもう一度',W/2,126,'#fff',12,'center');}
}

/* ===== ループ ===== */
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){update();acc-=STEP;}draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
