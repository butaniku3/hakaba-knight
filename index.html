<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>墓場の騎士</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:sans-serif}
#wrap{display:flex;flex-direction:column;height:100%}
#screen{position:relative;width:100%;flex:none}
canvas{display:block;width:100%;background:#000}
#mute{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;border:1px solid #777;font-size:18px;display:flex;align-items:center;justify-content:center}
#pad{flex:1;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;box-sizing:border-box;min-height:150px;background:#141018}
.grp{display:flex;gap:min(12px,2.5vw);align-items:center}
.btn{width:min(70px,18vw);height:min(70px,18vw);border-radius:50%;background:#2c2733;border:3px solid #5a5266;color:#eee;font-size:24px;display:flex;align-items:center;justify-content:center;font-weight:bold;touch-action:none}
.btn small{font-size:15px}
.dpad{display:grid;grid-template-columns:auto auto;gap:6px min(14px,3vw)}
.dpad .down{grid-column:1/3;justify-self:center}
.btn.on{filter:brightness(1.7)}
.btn.a{background:#7a1f1f;border-color:#c44}
.btn.b{background:#1f3a7a;border-color:#48c}
@media (orientation:landscape){
 #screen{height:100%;display:flex;justify-content:center}
 canvas{width:auto;height:100%}
 #pad{position:absolute;left:0;right:0;bottom:0;background:none;pointer-events:none;min-height:0}
 .btn{pointer-events:auto;opacity:.55}
 #mute{top:auto;bottom:6px;right:auto;left:50%;transform:translateX(-50%)}
}
/* マウスで操作するPCでは画面上のボタンを隠す（キーボードで遊ぶ） */
@media (hover:hover) and (pointer:fine){#pad{display:none}}
</style>
</head>
<body>
<div id="wrap">
 <div id="screen"><canvas id="c"></canvas><div id="mute">♪</div></div>
 <div id="pad">
  <div class="grp dpad"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div><div class="btn down" data-k="down">▼</div></div>
  <div class="grp"><div class="btn b" data-k="fire"><small>攻撃</small></div><div class="btn a" data-k="jump"><small>ジャンプ</small></div></div>
 </div>
</div>
<script>
const W=256,H=176;
const cv=document.getElementById('c');cv.width=W*3;cv.height=H*3;// 絵は3倍の解像度で描く
let ctx=cv.getContext('2d');

/* ===== 入力 ===== */
const keys={left:false,right:false,down:false,jump:false,fire:false};
let jumpPressed=false,firePressed=false,tapped=false;
function setKey(k,v){if(v&&!keys[k]){if(k==='jump')jumpPressed=true;if(k==='fire')firePressed=true;}keys[k]=v;}
document.querySelectorAll('.btn[data-k]').forEach(b=>{
 const k=b.dataset.k;
 const on=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}setKey(k,true);b.classList.add('on');startAudio();};
 const off=e=>{e.preventDefault();setKey(k,false);b.classList.remove('on');};
 b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
 b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();startAudio();tapped=true;});
// PC：スペース＝ジャンプ、エンター＝攻撃（Z／X／↑ でも操作できる）
const KM={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',KeyS:'down',Space:'jump',Enter:'fire',NumpadEnter:'fire',KeyZ:'jump',ArrowUp:'jump',KeyX:'fire'};
addEventListener('keydown',e=>{const k=KM[e.code];if(k){e.preventDefault();startAudio();setKey(k,true);}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)setKey(k,false);});
document.getElementById('mute').addEventListener('pointerdown',e=>{
 e.preventDefault();e.stopPropagation();startAudio();muted=!muted;
 e.currentTarget.textContent=muted?'×':'♪';if(!muted&&AC)bgmNext=AC.currentTime+0.05;
});

/* ===== サウンド ===== */
let AC=null,master=null,muted=false,nbuf=null;
function startAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.25;master.connect(AC.destination);bgmNext=AC.currentTime+0.05;}catch(_){}
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,d,type='square',v=0.3,slide=0,when=0){
 if(!AC||muted)return;const t=AC.currentTime+Math.max(0,when);
 const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);
}
function noise(d,v=0.3,when=0){
 if(!AC||muted)return;
 if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
 const s=AC.createBufferSource();s.buffer=nbuf;const g=AC.createGain();const t=AC.currentTime+Math.max(0,when);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.connect(g);g.connect(master);s.start(t);s.stop(t+d);
}
function sfx(n){
 switch(n){
  case'jump':tone(260,0.12,'square',0.18,300);break;
  case'throw':tone(700,0.07,'square',0.14,-400);break;
  case'tink':tone(1500,0.05,'square',0.12);break;
  case'hit':tone(300,0.06,'square',0.2,-150);break;
  case'kill':noise(0.15,0.3);tone(220,0.15,'sawtooth',0.18,-150);break;
  case'armor':noise(0.3,0.4);tone(500,0.35,'square',0.2,-420);break;
  case'die':tone(420,0.9,'square',0.22,-360);break;
  case'pickup':tone(880,0.08,'square',0.15);tone(1320,0.14,'square',0.15,0,0.08);break;
  case'crow':tone(900,0.15,'sawtooth',0.1,-500);break;
  case'dive':tone(600,0.25,'sawtooth',0.1,-350);break;
  case'fire':tone(150,0.3,'sawtooth',0.2,-80);break;
  case'land':noise(0.3,0.5);break;
  case'pot':noise(0.12,0.3);tone(400,0.08,'triangle',0.2);break;
  case'gfire':tone(420,0.18,'triangle',0.12,500);break;
  case'goff':tone(900,0.45,'sine',0.16,-700);break;
  case'gback':[0,0.08,0.16].forEach((w,i)=>tone([660,880,1320][i],0.14,'sine',0.13,0,w));break;
  case'gget':[0,0.1,0.2,0.3].forEach((w,i)=>tone([523,659,784,1046][i],0.2,'sine',0.14,0,w));break;
 }
}
/* うなる音色：2本の発振器を少しずらして重ね、ローパスでこもらせる */
function voice(f,d,{type='sawtooth',v=0.1,when=0,det=0,cut=0,att=0.005}={}){
 if(!AC||muted)return;const t=AC.currentTime+Math.max(0,when);
 const g=AC.createGain();
 if(cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;fl.Q.value=4;g.connect(fl);fl.connect(master);}else g.connect(master);
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(0.001,t+d);
 for(const dc of(det?[-det,det]:[0])){const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.detune.value=dc;o.connect(g);o.start(t);o.stop(t+d+0.05);}
}
/* 弔いの鐘（金属的な倍音を重ねる） */
function bell(f,when=0){[[1,0.12,3],[2.76,0.06,1.6],[5.4,0.035,0.8],[0.5,0.08,3.5]].forEach(([m,v,d])=>voice(f*m,d,{type:'sine',v,when}));}
/* ベース：ギャロップ（ダッ・ダダ・ダッ）で地を這うリズム */
function gallop(roots,len,hits){const a=[];for(let i=0;i<len;i++){const r=roots[Math.floor(i/8)%roots.length];a.push(hits.includes(i%8)?r:0);}return a;}
const SONGS={
 // 道中：Dフリジア＋三全音（悪魔の音程）。重い鼓動と低い唸り、ループ頭で鐘が鳴る
 stage:{bpm:104,lead:'square',cut:1600,melLen:1.8,
  mel:[62,0,0,63, 62,0,0,0, 68,0,67,0, 63,0,62,0, 62,0,0,63, 62,0,65,0, 68,0,0,0, 67,66,63,62],
  bass:gallop([38,38,44,39],32,[0,2,3,4,6]),
  drone:[38,44],
  drum:'K.......k...s...k.......k...s.s.'},
 // ボス：半音でせり上がる甲高い悲鳴と、休みなく叩きつけるベース
 boss:{bpm:150,lead:'sawtooth',cut:2600,melLen:0.9,
  mel:[74,73,74,0, 80,0,79,0, 74,73,74,0, 75,77,78,80, 81,80,81,0, 86,0,85,0, 80,79,80,0, 75,74,73,74],
  bass:gallop([38,39,38,44],32,[0,1,2,3,4,5,6,7]),
  drone:[26,32],
  drum:'K.s.k.s.k.s.k.sskks.k.s.k.s.k.ss'}
};
let bgm=null,bgmStep=0,bgmNext=0;
function playBGM(n){bgm=n;bgmStep=0;if(AC)bgmNext=AC.currentTime+0.05;}
function stopBGM(){bgm=null;}
function musicTick(){
 if(!AC||muted||!bgm)return;const s=SONGS[bgm],dt=60/s.bpm/2,N=s.mel.length;
 if(bgmNext<AC.currentTime)bgmNext=AC.currentTime+0.02;
 while(bgmNext<AC.currentTime+0.15){
  const i=bgmStep%N,w=bgmNext-AC.currentTime,m=s.mel[i];
  if(m)voice(mf(m),dt*s.melLen,{type:s.lead,v:0.06,when:w,det:9,cut:s.cut});
  const b=s.bass[i];if(b)voice(mf(b),dt*0.9,{type:'sawtooth',v:0.16,when:w,det:6,cut:480});
  if(i%16===0)s.drone.forEach(n=>voice(mf(n),dt*16.5,{type:'sawtooth',v:0.05,when:w,det:15,cut:320,att:0.8}));
  const d=s.drum[i];
  if(d==='k'||d==='K')tone(95,0.3,'sine',0.55,-60,w);
  if(d==='K')bell(mf(62),w);
  if(d==='s')noise(0.1,0.1,w);
  bgmNext+=dt;bgmStep++;
 }
}
function jingle(notes,dt){notes.forEach((m,i)=>{if(m)voice(mf(m),dt*1.1,{type:'sawtooth',v:0.09,when:i*dt,det:8,cut:1800});});}

/* ===== ステージ ===== */
const G=0.32,JV=-6,SPD=1.4,GY=144,LEVEL_W=3264,ARENA=LEVEL_W-W;
const solids=[];
[[0,700],[740,1300],[1340,1900],[1940,LEVEL_W]].forEach(([a,b])=>solids.push({x:a,y:GY,w:b-a,h:40,t:'g'}));
[[400,108,64],[1050,104,80],[1480,104,64],[1560,80,48],[2280,104,96],[2420,84,48]].forEach(([x,y,w])=>solids.push({x,y,w,h:8,t:'p'}));
const tombX=[180,330,520,880,1000,1180,1420,1660,1780,2060,2200,2500,2620,2800];
tombX.forEach(x=>solids.push({x,y:GY-18,w:14,h:18,t:'tomb'}));
const crowTombs=[330,1000,2200,2620];
const CP_X=1600;

let contT=0,continues=0,state='title',stateT=0,frame=0,score=0,lives=2,hi=0,timeLeft=0,camX=0,checkpoint=24,cpReached=false;
let bossLock=false,demonSpawned=false,clearT=0,shake=0,msg='',msgT=0,zTimer=0;
const BOSS_HAND=[16.3,-56.8],BOSS_VY=[-1.55,-2.57,-3.23];   // 投げる手の位置（足元の中心から）と、着地点が前と同じになる投げ上げの速さ
let bossFall=null,ghost=null,allyShots=[],player,shots=[],enemies=[],eshots=[],parts=[],items=[],pots=[];
try{hi=+localStorage.getItem('hakaba_hi')||0}catch(_){}

const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function move(e){
 e.hitWall=false;e.x+=e.vx;
 for(const s of solids)if(overlap(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;e.hitWall=true;}
 e.y+=e.vy;e.onGround=false;
 for(const s of solids)if(overlap(e,s)){if(e.vy>0){e.y=s.y-e.h;e.vy=0;e.onGround=true;}else if(e.vy<0){e.y=s.y+s.h;e.vy=0;}}
}
function hasGround(x){return solids.some(s=>s.t==='g'&&x>=s.x&&x<=s.x+s.w);}
function spawnOK(x,w){
 if(!hasGround(x)||!hasGround(x+w))return false;
 return !solids.some(s=>s.t==='tomb'&&x<s.x+s.w+2&&x+w>s.x-2);
}
function burst(x,y,n,cols,sp=2,g=0.12){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*sp*2,vy:(Math.random()-.8)*sp*1.5,l:25+Math.random()*20,c:cols[i%cols.length],g});}

function newGame(){ghost=null;score=0;lives=2;checkpoint=24;cpReached=false;startLife();}
function startLife(){
 pots=[[600,'dagger'],[940,'ghost'],[1240,'armor'],[2130,'gem'],[2700,'armor']].map(([x,c])=>({x,y:GY-12,w:12,h:12,c,alive:true}));
 player={x:checkpoint,y:GY-22,w:12,h:22,vx:0,vy:0,dir:1,onGround:true,armor:true,inv:60,st:'alive',dt:0,weapon:'lance',cool:0,throwT:0,crouch:false};
 enemies=[];shots=[];eshots=[];items=[];parts=[];allyShots=[];bossFall=null;
 if(ghost){ghost.x=player.x-12;ghost.y=player.y-16;}
 crowTombs.forEach(tx=>{if(tx>checkpoint+60)enemies.push({type:'crow',x:tx+1,y:GY-28,w:12,h:10,hp:1,st:'perch',t:0,vx:0,by:0});});
 demonSpawned=false;bossLock=false;clearT=0;timeLeft=180*60;zTimer=90;
 camX=Math.max(0,Math.min(LEVEL_W-W,player.x-W/2));
 state='play';stateT=0;jumpPressed=firePressed=false;playBGM('stage');
}
function die(){
 const p=player;if(p.st!=='alive')return;
 p.st='dead';p.dt=0;p.vy=-4;p.vx=0;stopBGM();sfx('die');try{navigator.vibrate&&navigator.vibrate(120)}catch(_){}
}
function hurt(){
 const p=player;
 if(p.armor){
  p.armor=false;p.inv=100;p.vy=-3.5;p.vx=-p.dir*1.3;p.onGround=false;sfx('armor');
  burst(p.x+6,p.y+8,10,['#dfe5ec','#aab4c0','#d23'],2.2);try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}
 }else die();
}
function harmful(e){
 if(e.type==='zombie')return e.st==='walk'||e.st==='fall'||(e.st==='rise'&&e.t>16)||(e.st==='sink'&&e.t<20);
 return true;
}
function killEnemy(e){
 e.dead=true;const pts={zombie:100,crow:100,demon:1000,boss:10000}[e.type];score+=pts;
 if(e.type==='boss'){
  for(let i=0;i<6;i++)burst(e.x+Math.random()*32,e.y+Math.random()*48,10,['#fa0','#ff4','#c22','#fff'],3);
  shake=30;noise(1,0.6);eshots=[];clearT=1;stopBGM();
  bossFall={x:e.x+e.w/2,y:e.y+e.h/2,vx:-(e.face||1)*1.4,vy:-4.2,r:0,dir:e.face||1,t:0}; // 倒れて吹き飛ぶ演出
  enemies.forEach(o=>{if(o!==e&&!o.dead){o.dead=true;burst(o.x+6,o.y+6,6,['#fa0','#fff']);}});
 }else burst(e.x+e.w/2,e.y+e.h/2,10,['#fa0','#ff4','#fff'],2);
 sfx('kill');
}
function saveHi(){if(score>hi){hi=score;try{localStorage.setItem('hakaba_hi',hi)}catch(_){}}}

/* ===== 更新 ===== */
/* 上から振りかぶって投げる：THR_WINDフレーム振りかぶり → 投げてTHR_RELフレーム腕を前に伸ばしたまま */
const THR_WIND=5,THR_REL=9;
function throwShot(p){if(p.st!=='alive'||clearT)return;const d=p.weapon==='dagger',w=d?10:16,h=d?3:4;
 // 手元から地面と平行にまっすぐ飛ぶ。膝立ちの時だけは今までどおり低く（墓石の上から膝立ちで投げるとゾンビに当たる）
 const ho=p.handOff||[p.dir*14,-18.5],hx=p.x+6+ho[0],cy=p.crouch?p.y+p.h-6+h/2:p.y+p.h+ho[1];
 shots.push({x:p.dir>0?hx-1:hx-w+1,y:cy-h/2,w,h,vx:p.dir*(d?5.5:4.2),k:p.weapon});sfx('throw');}
function updatePlayer(){
 const p=player;
 if(p.st==='dead'){
  p.dt++;p.vy+=0.2;p.y+=p.vy;
  if(p.dt>110){lives--;if(lives<0){state='continue';stateT=0;contT=600;saveHi();bell(mf(50));}else startLife();}
  return;
 }
 p.crouch=p.onGround&&keys.down;
 if(p.onGround){
  p.vx=p.crouch?0:keys.left?-SPD:keys.right?SPD:0;
  if(jumpPressed){p.vy=JV;p.onGround=false;p.crouch=false;sfx('jump');}
 }
 if(keys.left)p.dir=-1;if(keys.right)p.dir=1; // 空中でも向きだけは変えられる（軌道は変わらない）
 if(p.cool>0)p.cool--;if(p.inv>0)p.inv--;
 if(p.throwT>0){p.throwT--;if(p.throwT===THR_REL)throwShot(p);}   // 振りかぶりが終わった瞬間に手から放す
 if(firePressed&&p.cool<=0&&clearT===0&&p.throwT<=THR_REL){
  const d=p.weapon==='dagger',max=d?3:2;
  if(shots.length<max){p.cool=d?9:15;p.throwT=THR_REL+THR_WIND;}
 }
 p.vy=Math.min(6,p.vy+G);
 move(p);
 if(p.x<0)p.x=0;if(p.x>LEVEL_W-p.w)p.x=LEVEL_W-p.w;
 if(bossLock&&p.x<ARENA)p.x=ARENA;
 if(p.y>H+20){p.armor=false;die();}
}
function trySpawnZombie(){
 const p=player;if(bossLock||p.x>2880||p.st!=='alive'||clearT)return;
 if(enemies.filter(e=>e.type==='zombie').length>=4)return;
 const side=Math.random()<0.65?p.dir:-p.dir;const x=Math.round(p.x+side*(45+Math.random()*95));
 if(x<camX+4||x>camX+W-16||Math.abs(x-p.x)<30||!spawnOK(x,12))return;
 enemies.push({type:'zombie',x,y:GY-22,w:12,h:22,hp:1,st:'rise',t:0,vx:0,vy:0});
}
function updateEnemy(e){
 const p=player;e.t++;if(e.flash>0)e.flash--;
 switch(e.type){
 case'zombie':
  if(e.st==='rise'){if(e.t%6===0)burst(e.x+6,GY-1,2,['#4a3626','#2d4f2a'],1);if(e.t>=40){e.st='walk';e.t=0;e.vx=(p.x<e.x?-1:1)*(0.45+Math.random()*0.3);}}
  else if(e.st==='walk'){
   e.x+=e.vx;
   for(const s of solids)if(s.t==='tomb'&&overlap(e,s)){e.x-=e.vx;e.vx=-e.vx;break;}
   if(!hasGround(e.x+6)){e.st='fall';e.vy=0;}
   if(e.t>520){e.st='sink';e.t=0;}
  }else if(e.st==='sink'){if(e.t>=40)e.dead=true;}
  else if(e.st==='fall'){e.vy+=G;e.y+=e.vy;e.x+=e.vx;if(e.y>H)e.dead=true;}
  if(e.x<camX-80||e.x>camX+W+80)e.dead=true;
  break;
 case'crow':
  if(e.st==='perch'){if(Math.abs(p.x-e.x)<100&&p.st==='alive'){e.st='fly';e.vx=(p.x<e.x?-1:1)*1.3;e.by=e.y;e.t=0;sfx('crow');}}
  else{e.x+=e.vx;e.by+=((p.y+6)-e.by)*0.015;e.y=e.by+Math.sin(e.t*0.12)*14;if(e.x<camX-40||e.x>camX+W+40)e.dead=true;}
  break;
 case'demon':
  if(e.st==='hover'){
   const cx=e.x+e.w/2,tx=p.x+6+(cx<p.x+6?-80:80)-e.w/2,ty=Math.max(14,p.y-e.h-18);
   e.x+=Math.sign(tx-e.x)*Math.min(0.7,Math.abs(tx-e.x));e.y+=Math.sign(ty-e.y)*Math.min(0.5,Math.abs(ty-e.y));

/* --- レッサーデーモン：翼を付け根で回して羽ばたき、急降下では翼で体を包む姿に切りかえる --- */
const DIMG={};for(const k in DEMON_SRC){const im=new Image();im.src=DEMON_SRC[k];DIMG[k]=im;}
const DM={w:77.33,h:56.33,dw:37.0,dh:44.0,
 wl:[33.46,23.38],wr:[42.96,22.6],c1:[38.85,37.87],e1:[35.42,29.15],
 c2:[18.43,22.69],e2:[22.69,11.02]};
const imgOK=im=>im&&im.complete&&im.naturalWidth>0;
function demonEyes(x,y){const f=0.22+0.1*Math.sin(frame*0.3);glowAt(x-0.9,y,1.8,'255,200,60',f);glowAt(x+0.9,y-0.2,1.8,'255,200,60',f);}
// cx,cy=当たり判定の中心、dir=向き（右=1）、pz=急降下の姿への切りかえ具合(0〜1)
function drawDemon3(cx,cy,dir,pz,vx){if(!imgOK(DIMG.body))return;
 ctx.save();ctx.translate(cx,cy);ctx.scale(dir,1);
 if(pz<0.99){const ph=frame*0.21,fl=Math.sin(ph),a=0.3*fl,sq=1-0.14*Math.max(0,-fl),bob=fl*1.3;
  ctx.save();ctx.globalAlpha=1-pz;ctx.translate(-DM.c1[0],-DM.c1[1]+bob);
  const wing=(im,pv,ang)=>{ctx.save();ctx.translate(pv[0],pv[1]);ctx.rotate(ang);ctx.scale(1,sq);ctx.translate(-pv[0],-pv[1]);ctx.drawImage(im,0,0,DM.w,DM.h);ctx.restore();};
  wing(DIMG.wl,DM.wl,a);wing(DIMG.wr,DM.wr,-a);ctx.drawImage(DIMG.body,0,0,DM.w,DM.h);demonEyes(DM.e1[0],DM.e1[1]);ctx.restore();}
 if(pz>0.01){ctx.save();ctx.globalAlpha=pz;ctx.rotate(clamp(vx*0.22*dir,-0.45,0.45));ctx.translate(-DM.c2[0],-DM.c2[1]);ctx.drawImage(DIMG.dive,0,0,DM.dw,DM.dh);demonEyes(DM.e2[0],DM.e2[1]);ctx.restore();}
 ctx.restore();}


/* --- いただいたイラストを関節で動かす人形 --- */
const CI={};for(const n in CHAR_SRC){CI[n]={};for(const k in CHAR_SRC[n]){const im=new Image();im.src=CHAR_SRC[n][k];CI[n][k]=im;}}
const CM=CHAR_META;
// 点cを中心に点vを角度aだけ回す
const rotAbout=(v,a,c)=>{const dx=v[0]-c[0],dy=v[1]-c[1],co=Math.cos(a),si=Math.sin(a);return[c[0]+dx*co-dy*si,c[1]+dx*si+dy*co];};
// 部品を描く：もとの位置pvを、移動先atに置いて角度aだけ回す（部品の画像は全体と同じ大きさ）
function lay(n,k,pv,at,a){const im=CI[n][k];if(!imgOK(im))return;const m=CM[n];
 if(!pv){ctx.drawImage(im,0,0,m.w,m.h);return;}ctx.save();ctx.translate(at[0],at[1]);if(a)ctx.rotate(a);ctx.drawImage(im,-pv[0],-pv[1],m.w,m.h);ctx.restore();}

/* 騎士：太もも(t)とすね(s)の角度。プラスは時計回り＝右向きの体で足先が後ろへ */
const KNEEL={naked:{tF:-1.15,sF:0.06,tB:0.58,sB:1.22},armor:{tF:-1.06,sF:0.1,tB:0.44,sB:1.34}};
function knightPose3(p,n){
 const o={tB:0,sB:0,tF:0,sF:0,arm:0,by:Math.sin(frame*0.06)*0.2,rot:0};
 if(p.st==='dead'){const t=Math.min(1,p.dt/30);Object.assign(o,{rot:-1.45*t,tF:-0.6*t,sF:-0.2*t,tB:0.3*t,sB:0.5*t,arm:-1.2*t,by:0});return o;}
 if(p.crouch){Object.assign(o,KNEEL[n]);o.by=0;o.arm=0.15;}
 else if(!p.onGround){Object.assign(o,{tF:-0.75,sF:0.2,tB:0.38,sB:0.95,arm:-0.35,by:0});}
 else if(p.vx!==0){const ph=frame*0.2,s=Math.sin(ph),c=Math.cos(ph);
  o.tF=-0.32*s;o.tB=0.32*s;o.sF=o.tF+0.5*Math.max(0,c);o.sB=o.tB+0.5*Math.max(0,-c);o.by=-Math.abs(c)*0.7;o.arm=0.12*s;}
 if(p.throwT>0){const k=clamp((10-p.throwT)/3,0,1);o.arm=lerp(0.55,p.crouch?-0.35:-0.95,k);}
 return o;}
// 振りかぶった拳に握っている武器（槍は穂先を前の少し上へ、拳が柄の後ろ寄りを握る）
function heldWeapon(f,p){ctx.save();ctx.translate(f[0],f[1]);ctx.rotate(-0.42);
 if(p.weapon==='dagger')blit(DAGGER,-3.5,-2);else blit(LANCE,-6,-2);ctx.restore();}
// 投げた直後の、腕を振り下ろした軌跡：頭の上から前の手先へ、先へいくほど濃く太い筋（うっすら）
function throwSwoosh(c,r,a1,k){ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
 const a0=a1-1.45,N=7;
 for(let i=0;i<N;i++){const u=i/N,v=(i+1)/N;ctx.strokeStyle=`rgba(255,236,205,${0.34*v*v*(1-k)})`;ctx.lineWidth=0.5+1.3*v;
  ctx.beginPath();ctx.arc(c[0],c[1],r,a0+(a1-a0)*u,a0+(a1-a0)*v+0.02);ctx.stroke();}
 ctx.restore();}
/* 投げた瞬間の前傾：立って投げた手（＝槍の高さ）がゾンビの胸（地面から KCHEST ドット）に来て、墓石にも当たるように、上半身を腰の下を中心に倒す角度を求める */
const KCHEST=18.5,KLEAN={};   // 18.5：ゾンビの胸の真ん中、かつ墓石（高さ18）に必ず当たる高さ
const knightHip=n=>{const b=CM[n].pt.bk;return[b[0],b[1]+2.6];};   // 回す中心：ベルトの少し下（腰当て・腰布の下端あたり）
const knightHandR=n=>{const T=CM[n].pt,R=CM[n+'R'].pt;return[T.bk[0]-R.bk[0]+R.hand[0],T.bk[1]-R.bk[1]+R.hand[1]];};
function knightLean(n){if(KLEAN[n]!==undefined)return KLEAN[n];
 const hp=knightHip(n),h=knightHandR(n),v=[h[0]-hp[0],h[1]-hp[1]],ty=CM[n].pt.c[1]-KCHEST-hp[1];let lo=0,hi=0.9;
 for(let i=0;i<30;i++){const a=(lo+hi)/2;if(v[0]*Math.sin(a)+v[1]*Math.cos(a)<ty)lo=a;else hi=a;}
 return KLEAN[n]=(lo+hi)/2;}
function drawKnight3(x,feet,dir,p){
 const n=p.armor?'armor':'naked',m=CM[n],P=m.pv,T=m.pt,o=knightPose3(p,n);
 // 投げている間は腰から上を投げの絵に差しかえる（W=振りかぶり、R=投げた瞬間）。脚はいつもの動きのまま
 const ph=p.st!=='dead'&&p.throwT>0?(p.throwT>THR_REL?'W':'R'):null,up=ph&&CI[n+ph]&&imgOK(CI[n+ph].torso)?n+ph:null;
 const kB=rotAbout(P.shinB,o.tB,P.thighB),kF=rotAbout(P.shinF,o.tF,P.thighF);
 const onShin=(pt,L)=>{const k0=P['shin'+L],kn=L==='B'?kB:kF,q=rotAbout(pt,o['s'+L],k0);return[q[0]-k0[0]+kn[0],q[1]-k0[1]+kn[1]];};
 const pts=[onShin(T.soleB,'B'),onShin(T.toeB,'B'),onShin(T.soleF,'F'),onShin(T.toeF,'F')];
 if(p.crouch)pts.push(rotAbout(T.kneeB,o.tB,P.thighB));
 const low=Math.max(...pts.map(q=>q[1]));
 ctx.save();ctx.translate(x,feet);ctx.scale(dir,1);if(o.rot)ctx.rotate(o.rot);ctx.translate(-T.c[0],-low+o.by);
 lay(n,'shinB',P.shinB,kB,o.sB);lay(n,'thighB',P.thighB,P.thighB,o.tB);
 lay(n,'shinF',P.shinF,kF,o.sF);lay(n,'thighF',P.thighF,P.thighF,o.tF);
 // 投げた瞬間の手の位置（前に倒した後）を覚えておく：飛んでいく武器を手から出すため
 if(p.st==='alive'){const q=rotAbout(knightHandR(n),knightLean(n),knightHip(n));p.handOff=[dir*(q[0]-T.c[0]),q[1]-low+o.by];}   // 足元の中心からの手の位置
 if(up){const U=CM[up].pt;ctx.save();
  if(ph==='R'){const hp=knightHip(n),a=knightLean(n)*Math.min(1,p.throwT/4);   // 投げた瞬間は上半身を前に倒し、終わりぎわに起こす
   ctx.translate(hp[0],hp[1]);ctx.rotate(a);ctx.translate(-hp[0],-hp[1]);}
  ctx.translate(T.bk[0]-U.bk[0],T.bk[1]-U.bk[1]);
  if(ph==='W')heldWeapon(U.fist,p);
  lay(up,'torso');
  if(ph==='R'&&p.throwT>THR_REL-4){const h=U.hand,c=[U.bk[0]-1,h[1]+6];throwSwoosh(c,Math.hypot(h[0]-c[0],h[1]-c[1]),Math.atan2(h[1]-c[1],h[0]-c[0]),(THR_REL-p.throwT)/4);}
  ctx.restore();}
 else{lay(n,'armF',P.armF,P.armF,o.arm);lay(n,'torso');}
 ctx.restore();}

/* ゾンビ：脚を付け根で交互に振り、腕をぶらぶら揺らしてよろよろ歩く */
function drawZombie3(x,feet,dir,ph,walk){const n='zombie',m=CM[n],P=m.pv,T=m.pt;if(!imgOK(CI[n].torso))return;
 const s=walk?Math.sin(ph):0,c=walk?Math.cos(ph):0,aB=0.2*s,aF=-0.2*s,aA=walk?0.07*Math.sin(ph*0.5+1):0.03*Math.sin(frame*0.05);
 const low=Math.max(rotAbout(T.soleB,aB,P.legB)[1],rotAbout(T.soleF,aF,P.legF)[1]);
 ctx.save();ctx.translate(x,feet);ctx.scale(dir,1);ctx.translate(-T.c[0],-low-Math.abs(c)*0.5);

function drawItem(it){
 if(it.t>600&&frame%6<3)return;const sx=it.x-camX,y=it.y;
 if(it.k==='ghost'){glowAt(sx+5,y+2,14,'140,170,255',0.35);ctx.save();ctx.globalAlpha=0.92;blit(GHOST[Math.floor(frame/12)%2],sx-3,y-8+Math.sin(frame*0.1)*2);ctx.restore();}
 else if(it.k==='armor'||it.k==='gem'){glowAt(sx+5,y+5,10,'255,220,140',0.25+0.15*Math.sin(frame*0.15));blit(ITEM[it.k],sx-1,y);}
 else if(it.k==='dagger')blit(DAGGER,sx-1,y+3);else blit(LANCE,sx-4,y+3);
}
function drawWorld(){
 ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*4,(Math.random()-.5)*4);
 drawBG();drawSolids();
 for(const pt of pots)if(pt.alive)blit(POT,pt.x-camX,pt.y);
 items.forEach(drawItem);enemies.forEach(drawEnemy);
 if(state==='play')drawPlayer();
 if(bossFall){const b=bossFall;ctx.save();ctx.globalAlpha=clamp(1-(b.t-110)/40,0,1);drawBossJump(b.x-camX,b.y,b.dir,b.r);ctx.restore();}
 for(const s of allyShots)drawFireball(s.x-camX+4,s.y+4,3.6,true);
 if(ghost&&ghost.gone===0&&state==='play'){glowAt(ghost.x-camX+7,ghost.y+8,16,'140,170,255',0.3);ctx.save();ctx.globalAlpha=0.9;ctx.translate(ghost.x-camX+7,0);ctx.scale(ghost.dir||1,1);blit(GHOST[Math.floor(frame/12)%2],-8,ghost.y-2);ctx.restore();}
 for(const s of shots){const d=Math.sign(s.vx);ctx.save();ctx.translate(s.x-camX+s.w/2,s.y+s.h/2);ctx.scale(d,1);if(s.k==='dagger')blit(DAGGER,-6,-2);else blit(LANCE,-9,-2);ctx.restore();}
 for(const f of eshots){glowAt(f.x-camX+4,f.y+4,12,'255,120,40',0.35);drawFireball(f.x-camX+4,f.y+4,4.2,false);}
 for(const q of parts){ctx.globalAlpha=Math.min(1,q.l/15);ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x-camX,q.y,0.9,0,7);ctx.fill();}ctx.globalAlpha=1;
 tiled(FG,camX*1.25,H-40,512);
 blit(VIGNETTE,0,0);
 ctx.restore();
}
function perfCheck(){const t=performance.now();if(lastT){ftAvg=ftAvg*0.97+(t-lastT)*0.03;if(ftAvg>27&&frame>180)LOWQ=true;}lastT=t;}
function draw(){
 perfCheck();ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 if(state==='title'){
  camX=(frame*0.4)%(LEVEL_W-W-400);drawBG();drawSolids();
  drawKnight3(30,GY,1,{onGround:true,vx:0,crouch:false,throwT:0,st:'alive',armor:true});drawZombie3(W-34,GY,-1,frame*0.12,true);
  tiled(FG,camX*1.25,H-40,512);blit(VIGNETTE,0,0);R(0,0,W,H,'rgba(0,0,0,.25)');
  logo('墓場の騎士',W/2,22,32);TG('〜魔王城への道〜',W/2,60,'#ffd8a8',11,'center','#a40');
  if(frame%60<40)TG('タップでスタート',W/2,92,'#fff',12,'center','#000');
  R(0,118,W,58,'rgba(4,2,10,.55)');
  T('◀▶ 移動 / ▼ 膝立ち / ジャンプ / 攻撃',W/2,124,'#ddd',10,'center');
  T('ジャンプ中は方向を変えられないぞ！',W/2,140,'#bbb',9,'center');
  T('PC：←→ 移動 / ↓ 膝立ち / スペース ジャンプ / エンター 攻撃',W/2,153,'#c8c0d8',7,'center');
  if(hi)HT('HI  '+hi,W/2,164,'#ffd060',8,'center');
  return;
 }
 drawWorld();drawHUD();
 if(msgT>0&&msg&&state==='play')TG(msg,W/2,44,'#ffe080',12,'center','#a40');
 if(state==='continue'){const n=Math.max(0,Math.ceil(contT/60)-1);R(0,0,W,H,'rgba(0,0,0,.6)');
  TG('コンティニュー？',W/2,34,'#ffe080',18,'center','#f80');
  ctx.save();ctx.font=`bold 40px ${SERIF}`;ctx.textAlign='center';ctx.textBaseline='top';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(String(n),W/2,60);ctx.fillStyle=n<=3?'#ff4030':'#fff';ctx.shadowColor=n<=3?'#f00':'#a6f';ctx.shadowBlur=10*S;ctx.fillText(String(n),W/2,60);ctx.restore();
  if(stateT>40&&frame%40<28)T('タップでつづける',W/2,112,'#fff',12,'center');
  T('チェックポイントから再開・スコアは0にもどります',W/2,134,'#bbb',8,'center');
  if(hi)HT('HI  '+hi,W/2,150,'#ffd060',8,'center');}
 if(state==='over'){R(0,0,W,H,'rgba(0,0,0,.6)');ctx.save();ctx.font=`bold 26px ${SERIF}`;ctx.textAlign='center';ctx.textBaseline='top';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText('GAME OVER',W/2,52);ctx.fillStyle=lin(ctx,0,52,0,78,[[0,'#ff8060'],[0.5,'#d01818'],[1,'#600408']]);ctx.shadowColor='#f00';ctx.shadowBlur=10*S;ctx.fillText('GAME OVER',W/2,52);ctx.restore();
  HT('SCORE  '+score,W/2,90,'#f4eee0',9,'center');HT('HI  '+hi,W/2,103,'#ffd060',9,'center');if(stateT>40&&frame%60<40)T('タップでリトライ',W/2,122,'#fff',12,'center');}
 if(state==='clear'){R(0,0,W,H,'rgba(0,0,0,.55)');TG('ステージクリア！',W/2,50,'#ffe080',20,'center','#f80');T('魔王城への道が開かれた…',W/2,80,'#fda',11,'center');HT('SCORE  '+score,W/2,100,'#f4eee0',9,'center');HT('HI  '+hi,W/2,113,'#ffd060',9,'center');if(stateT>40&&frame%60<40)T('タップでもう一度',W/2,130,'#fff',12,'center');}
}

/* ===== ループ ===== */
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=STEP){update();acc-=STEP;}draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.booted=1;
}
requestAnimationFrame(()=>setTimeout(boot,30));
</script>
